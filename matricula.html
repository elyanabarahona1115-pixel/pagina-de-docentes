<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitar matrícula | Instituto Francisco Miranda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="matricula-page">
  <header class="sticky-top shadow-sm site-header">
    <nav class="navbar navbar-expand-lg navbar-light container-fluid px-3">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <span class="logo-placeholder"><img src="fotos de maestros/Logo Instituto transparente.png" alt="Logo del Instituto Técnico Gubernamental Francisco Miranda" /></span>
        <span class="institution-name">Instituto Francisco Miranda</span>
      </a>
      <div class="ms-auto">
        <a class="nav-link d-inline-block" href="index.html">Volver al inicio</a>
      </div>
    </nav>
  </header>

  <main class="matricula-page-main py-5">
    <div class="container">
      <div class="matricula-form-page mx-auto">
        <span class="eyebrow">Proceso de admisión</span>
        <h1 class="section-title mb-3">Solicitar matrícula</h1>
        <p class="matricula-texto">Completa la información y adjunta los documentos necesarios para iniciar tu solicitud.</p>

        <form class="row g-3" action="#" method="post" enctype="multipart/form-data">
          <div class="col-md-6">
            <label for="tipo-matricula" class="form-label">Tipo de matrícula</label>
            <select id="tipo-matricula" name="tipo-matricula" class="form-select form-control-lg" required>
              <option value="" selected disabled>Seleccione una opción</option>
              <option>Nuevo ingreso</option>
              <option>Reingreso</option>
              <option>Traslado</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="nombre-estudiante" class="form-label">Nombre del estudiante</label>
            <input id="nombre-estudiante" name="nombre-estudiante" class="form-control form-control-lg" type="text" required />
          </div>
          <div class="col-12">
            <label for="grado-cursar" class="form-label">Grado a cursar</label>
            <input id="grado-cursar" name="grado-cursar" class="form-control form-control-lg" type="text" placeholder="Ejemplo: 4to Bachillerato" required />
          </div>
          <div class="col-md-6">
            <label for="partida" class="form-label">Partida de nacimiento</label>
            <input id="partida" name="partida" class="form-control form-control-lg" type="file" accept=".pdf,.jpg,.jpeg,.png" required />
          </div>
          <div class="col-md-6">
            <label for="notas" class="form-label">Notas del año anterior</label>
            <input id="notas" name="notas" class="form-control form-control-lg" type="file" accept=".pdf,.jpg,.jpeg,.png" required />
          </div>
          <div class="col-12 text-center mt-4">
            <button type="submit" class="btn btn-warning btn-lg matricula-submit">Enviar solicitud</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-dark text-white">
    <div class="container text-center">
      <p class="mb-0">© 2026 Instituto Gubernamental Técnico Francisco Miranda</p>
    </div>
  </footer>
</body>
</html>
